<!DOCTYPE html>
<!--
  =====================================================================
  realisation.html — Page de détail d'une réalisation (modèle unique)
  ---------------------------------------------------------------------
  Cette page sert pour TOUTES les réalisations. L'identifiant du projet
  est dans l'adresse : realisation.html?id=dig-incremental
  script.js lit cet identifiant, retrouve la réalisation dans
  realisations.js et fabrique le contenu de la balise #realisation-root :
  titre, date, statut, technologies, cadre de réalisation, description
  détaillée, galerie de captures, liens, compétences du bloc 1 couvertes.
  → Il n'y a rien à modifier ici pour ajouter une réalisation.
  =====================================================================
-->

  <meta name="author" content="Dante Ciancilla">

  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

  <!-- Même petit script que sur la page d'accueil : thème (sombre par défaut) appliqué avant l'affichage -->
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("js");

      var theme = null;
      try {
        theme = localStorage.getItem("theme");
      } catch (e) { /* localStorage bloqué : on garde le thème par défaut */ }

      // Pas de choix mémorisé : le mode sombre est utilisé par défaut
      if (theme !== "light" && theme !== "dark") {
        theme = "dark";
      }
      root.setAttribute("data-theme", theme);

      // Sécurité : si script.js ne se lance pas, on affiche quand même tout le contenu.
      setTimeout(function () {
        if (!root.classList.contains("js-ready")) {
          root.classList.remove("js");
        }
      }, 4000);
    })();
  </script>
  <script src="textes.js?v=202611071844" defer></script>
  <script src="competences-bloc1.js?v=202611071844" defer></script>
  <script src="realisations.js?v=202611071844" defer></script>
  <script src="script.js?v=202611071844" defer></script>
</head>

<body>
